name: SmartShop Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/android-accounts-sync]
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - name: Install locked dependencies
        run: npm install --ignore-scripts
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm run check:rls
      - name: Browser interaction tests
        run: npm run test:e2e
      - run: npm run build:web
      - name: Synchronise web assets into Capacitor
        run: npx cap sync android
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Android unit and build checks
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Verify genuine APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: smartshop-android-debug-build-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
